<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fuel Path</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085; --border: #e3e6eb;
      --accent: #2563eb; --stop: #ea580c; --start: #16a34a; --finish: #dc2626; --error: #b42318;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); background: var(--bg); }
    .layout { display: grid; grid-template-columns: 400px 1fr; height: 100vh; }
    aside { background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; padding: 20px; }
    #map { height: 100%; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .subtitle { color: var(--muted); margin: 0 0 18px; }
    label { display: block; font-weight: 600; margin: 12px 0 4px; }
    .field { position: relative; }
    input { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; font: inherit; }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .suggestions { position: absolute; z-index: 1000; left: 0; right: 0; top: 100%; margin: 4px 0 0; padding: 4px 0;
      list-style: none; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.08); }
    .suggestions li { padding: 7px 11px; cursor: pointer; }
    .suggestions li.active, .suggestions li:hover { background: #eef2ff; }
    button { margin-top: 16px; width: 100%; padding: 10px; border: 0; border-radius: 8px; background: var(--accent);
      color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .error { margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: #fef3f2; color: var(--error); }
    .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0 6px; }
    .stat { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
    .stat .value { font-size: 18px; font-weight: 700; }
    .stat .name { color: var(--muted); font-size: 12px; }
    .note { color: var(--muted); font-size: 12px; margin: 6px 0 14px; }
    .stops { list-style: none; padding: 0; margin: 0; }
    .stops li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); cursor: pointer; }
    .stops li:hover { background: #fafbfc; }
    .badge { width: 24px; height: 24px; border-radius: 50%; background: var(--stop); color: #fff; font-weight: 700;
      display: grid; place-items: center; font-size: 12px; }
    .stop-name { font-weight: 600; }
    .stop-meta { color: var(--muted); font-size: 12px; }
    .stop-cost { text-align: right; font-weight: 600; }
    .stop-number { background: var(--stop); color: #fff; border: 2px solid #fff; border-radius: 50%; font-weight: 700;
      display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: auto 60vh; height: auto; }
      aside { border-right: 0; border-bottom: 1px solid var(--border); padding: 16px; }
    }
  </style>
</head>
<body>
<div class="layout">
  <aside>
    <h1>Fuel Path</h1>
    <p class="subtitle">Cheapest fuel stops between two US cities (500-mile range, 10 mpg).</p>
    <form id="route-form" autocomplete="off">
      <label for="start">Start</label>
      <div class="field"><input id="start" placeholder="e.g. Portland, OR" required><ul class="suggestions" hidden></ul></div>
      <label for="finish">Destination</label>
      <div class="field"><input id="finish" placeholder="e.g. Des Moines, IA" required><ul class="suggestions" hidden></ul></div>
      <button type="submit" id="submit">Plan route</button>
    </form>
    <div id="error" class="error" hidden></div>
    <div id="results" hidden>
      <div class="summary">
        <div class="stat"><div class="value" id="total-cost"></div><div class="name">Total fuel cost</div></div>
        <div class="stat"><div class="value" id="distance"></div><div class="name">Distance</div></div>
        <div class="stat"><div class="value" id="gallons"></div><div class="name">Gallons bought</div></div>
        <div class="stat"><div class="value" id="stop-count"></div><div class="name">Fuel stops</div></div>
      </div>
      <p class="note" id="note"></p>
      <ul class="stops" id="stops"></ul>
    </div>
  </aside>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([39.5, -98.35], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  }).addTo(map);
  const layers = L.layerGroup().addTo(map);
  const stopMarkers = [];

  const money = (n) => n.toLocaleString('en-US', { style: 'currency', currency: 'USD' });
  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // City autocomplete backed by /api/cities (local Census data, no external calls).
  function autocomplete(input) {
    const list = input.nextElementSibling;
    let items = [], active = -1, timer;
    const close = () => { list.hidden = true; active = -1; };
    const choose = (i) => { input.value = items[i].label; close(); };
    const render = () => {
      list.innerHTML = items.map((item, i) => `<li class="${i === active ? 'active' : ''}" data-i="${i}">${escapeHtml(item.label)}</li>`).join('');
      list.hidden = !items.length;
    };
    input.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(async () => {
        const q = input.value.trim();
        if (q.length < 2) { items = []; return render(); }
        const response = await fetch(`/api/cities?${new URLSearchParams({ q })}`);
        items = (await response.json()).results;
        active = -1;
        render();
      }, 150);
    });
    input.addEventListener('keydown', (e) => {
      if (list.hidden) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        active = (active + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
        render();
      } else if (e.key === 'Enter' && active >= 0) {
        e.preventDefault();
        choose(active);
      } else if (e.key === 'Escape') {
        close();
      }
    });
    list.addEventListener('mousedown', (e) => { const li = e.target.closest('li'); if (li) choose(+li.dataset.i); });
    input.addEventListener('blur', () => setTimeout(close, 100));
  }
  autocomplete(document.getElementById('start'));
  autocomplete(document.getElementById('finish'));

  const form = document.getElementById('route-form');
  const submit = document.getElementById('submit');
  const errorBox = document.getElementById('error');
  const results = document.getElementById('results');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const params = new URLSearchParams({
      start: document.getElementById('start').value.trim(),
      finish: document.getElementById('finish').value.trim(),
    });
    submit.disabled = true;
    submit.textContent = 'Planning…';
    errorBox.hidden = true;
    try {
      const response = await fetch(`/api/route?${params}`);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
      show(data);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.hidden = false;
    } finally {
      submit.disabled = false;
      submit.textContent = 'Plan route';
    }
  });

  function show(data) {
    layers.clearLayers();
    stopMarkers.length = 0;

    const line = L.polyline(data.route.coordinates.map(([lng, lat]) => [lat, lng]), { color: '#2563eb', weight: 4, opacity: .8 }).addTo(layers);

    for (const s of data.stations_on_route) {
      L.circleMarker([s.lat, s.lng], { radius: 3, color: '#98a2b3', weight: 1, fillOpacity: .7 })
        .bindTooltip(`${escapeHtml(s.name)} · $${s.price_per_gallon.toFixed(3)}`).addTo(layers);
    }

    const endpoint = (place, color, title) => L.circleMarker([place.lat, place.lng], { radius: 8, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1 })
      .bindPopup(`<b>${title}</b><br>${escapeHtml(place.label)}`).addTo(layers);
    // SVG fill attributes don't resolve CSS variables, so these are literal colors.
    endpoint(data.start, '#16a34a', 'Start');
    endpoint(data.finish, '#dc2626', 'Destination');

    data.fuel_stops.forEach((stop, i) => {
      const icon = L.divIcon({ className: '', html: `<div class="stop-number" style="width:26px;height:26px">${i + 1}</div>`, iconSize: [26, 26] });
      const marker = L.marker([stop.lat, stop.lng], { icon, zIndexOffset: 1000 }).bindPopup(
        `<b>Stop ${i + 1}: ${escapeHtml(stop.name)}</b><br>${escapeHtml(stop.address)}, ${escapeHtml(stop.city)}, ${stop.state}` +
        `<br>Mile ${stop.mile} · $${stop.price_per_gallon.toFixed(3)}/gal<br>${stop.gallons.toFixed(1)} gal = <b>${money(stop.cost)}</b>`
      ).addTo(layers);
      stopMarkers.push(marker);
    });

    map.fitBounds(line.getBounds(), { padding: [30, 30] });

    document.getElementById('total-cost').textContent = money(data.total_fuel_cost);
    document.getElementById('distance').textContent = `${Math.round(data.distance_miles).toLocaleString()} mi`;
    document.getElementById('gallons').textContent = data.total_gallons.toFixed(1);
    document.getElementById('stop-count').textContent = data.fuel_stops.length;
    document.getElementById('note').textContent =
      `${data.start.label} → ${data.finish.label} via ${data.routing_provider}. ` +
      `${data.stations_on_route.length} stations within ${data.assumptions.corridor_miles} mi of the route. ` +
      `Starting fuel covers the drive to the first stop and isn't counted.`;
    document.getElementById('stops').innerHTML = data.fuel_stops.map((stop, i) => `
      <li data-i="${i}">
        <span class="badge">${i + 1}</span>
        <span><span class="stop-name">${escapeHtml(stop.name)}</span><br>
          <span class="stop-meta">${escapeHtml(stop.city)}, ${stop.state} · mile ${stop.mile} · $${stop.price_per_gallon.toFixed(3)}/gal</span></span>
        <span class="stop-cost">${money(stop.cost)}<br><span class="stop-meta">${stop.gallons.toFixed(1)} gal</span></span>
      </li>`).join('');
    results.hidden = false;
  }

  document.getElementById('stops').addEventListener('click', (e) => {
    const li = e.target.closest('li');
    if (!li) return;
    const marker = stopMarkers[+li.dataset.i];
    map.flyTo(marker.getLatLng(), 10);
    marker.openPopup();
  });
</script>
</body>
</html>
